[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# internal
mvm-core = { path = "crates/core" }
mvm-export = { path = "crates/export" }
mvm-gpu = { path = "crates/gpu" }
mvm-media = { path = "crates/media" }
mvm-platform = { path = "crates/platform" }
mvm-preview = { path = "crates/preview" }
mvm-project = { path = "crates/project" }
mvm-app = { path = "crates/app" }
mvm-audio = { path = "crates/audio" }
mvm-text = { path = "crates/text" }
mvm-testkit = { path = "crates/testkit" }

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# ui
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
