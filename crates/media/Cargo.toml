[package]
name = "mvm-media"
description = "FFmpeg による probe・静止画・音声・映像 decode。unsafe は FFI module だけ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
mvm-core = { workspace = true }
ffmpeg-sys-next = { version = "=8.1.0", default-features = false, features = [
    "avcodec",
    "avformat",
    "swresample",
    "swscale",
] }
wgpu = { version = "30", default-features = false, features = ["std", "dx12"] }
wgpu-hal = { version = "30", default-features = false, features = ["dx12"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

[dev-dependencies]
mvm-gpu = { workspace = true }
mvm-testkit = { workspace = true }
